<!doctype html>
<!--
  Profile README header banner. Rendered by scripts/render-readme-images.js at 1280x400 CSS px
  (1.5x device scale) to assets/header.png. The photo src token is replaced with rj.png as a data URI.
  Palette follows the rjl.ai OG card: navy #000728 -> #002685, cyan #1AD3F0, mint #3EE6A8.
  Evergreen content only - job-search status lives in the README badge row, not here.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
    html, body { margin: 0; background: transparent; }

    .banner {
        position: relative;
        width: 1280px;
        height: 400px;
        border-radius: 28px;
        overflow: hidden;
        color: #fff;
        font-family: Inter, "Segoe UI", sans-serif;
        background:
            radial-gradient(circle at 81% 48%, rgba(26, 211, 240, 0.30) 0%, rgba(26, 211, 240, 0) 38%),
            radial-gradient(circle at 100% 100%, rgba(10, 59, 176, 0.85) 0%, rgba(10, 59, 176, 0) 55%),
            linear-gradient(115deg, #000417 0%, #000a33 42%, #00217a 78%, #0a3bb0 100%);
    }

    /* Faint blueprint grid, fading out toward the text side. */
    .grid {
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(26, 211, 240, 0.07) 1px, transparent 1px),
            linear-gradient(90deg, rgba(26, 211, 240, 0.07) 1px, transparent 1px);
        background-size: 40px 40px;
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 55%, #000 100%);
        mask-image: linear-gradient(90deg, transparent 0%, #000 55%, #000 100%);
    }

    .hex {
        position: absolute;
        right: -20px;
        top: -34px;
        width: 520px;
        height: 520px;
    }

    .streak {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: linear-gradient(90deg, rgba(62, 230, 168, 0) 0%, #3EE6A8 30%, #1AD3F0 60%, rgba(26, 211, 240, 0) 100%);
        opacity: 0.85;
    }

    /* The cutout's shoulders end in hard vertical edges: bleed the right one off the banner
       and fade the left one out. */
    .photo {
        position: absolute;
        right: -18px;
        bottom: 0;
        height: 392px;
        filter: drop-shadow(0 0 36px rgba(26, 211, 240, 0.28));
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 22%);
        mask-image: linear-gradient(90deg, transparent 0%, #000 22%);
    }

    .copy {
        position: absolute;
        left: 64px;
        top: 52px;
        width: 760px;
    }

    .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: #1AD3F0;
    }

    .eyebrow::before {
        content: "";
        width: 28px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, #3EE6A8, #1AD3F0);
    }

    h1 {
        margin: 14px 0 10px;
        font-size: 84px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.025em;
    }

    .tagline {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.01em;
    }

    .tagline em {
        font-style: normal;
        background: linear-gradient(90deg, #3EE6A8, #1AD3F0);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .sub {
        margin: 8px 0 0;
        font-size: 17px;
        font-weight: 500;
        color: #A9B8DA;
    }

    .stats {
        display: flex;
        gap: 12px;
        margin-top: 28px;
    }

    .stat {
        width: 168px;
        box-sizing: border-box;
        padding: 13px 16px 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(26, 211, 240, 0.28);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .stat b {
        display: block;
        font-size: 28px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.01em;
    }

    .stat span {
        display: block;
        margin-top: 3px;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.3;
        color: #9FB0D6;
    }
</style>
</head>
<body>
<div class="banner">
    <div class="grid"></div>
    <svg class="hex" viewBox="0 0 520 520" aria-hidden="true">
        <polygon points="260,24 464,142 464,378 260,496 56,378 56,142" fill="none" stroke="#1AD3F0" stroke-opacity="0.30" stroke-width="2"/>
        <polygon points="260,84 412,172 412,348 260,436 108,348 108,172" fill="none" stroke="#1AD3F0" stroke-opacity="0.14" stroke-width="2"/>
    </svg>
    <img class="photo" src="__PHOTO__" alt="">
    <div class="copy">
        <div class="eyebrow">ENGINEERING EXECUTIVE</div>
        <h1>RJ Lindelof</h1>
        <p class="tagline">AI that <em>ships</em>, not AI theater.</p>
        <p class="sub">HealthTech &middot; GovTech &middot; EdTech &middot; Regulated B2B SaaS</p>
        <!-- Every stat must match the master resume (job-application-files/rj_lindelof.md). -->
        <div class="stats">
            <div class="stat"><b>20+</b><span>years leading engineering orgs</span></div>
            <div class="stat"><b>-90%</b><span>LLM inference cost</span></div>
            <div class="stat"><b>40%</b><span>code coverage, up from under 10%</span></div>
            <div class="stat"><b>-70%</b><span>new-engineer onboarding time</span></div>
        </div>
    </div>
    <div class="streak"></div>
</div>
</body>
</html>
